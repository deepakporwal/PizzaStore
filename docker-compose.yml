services:
  pizzastore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizzastore-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Pizzas: "Data Source=/app/data/Pizzas.db"
      Jwt__Key: "ThisIsASuperSecretKeyForPizzaStore1234567890!"
      Jwt__Issuer: "PizzaStore"
      Jwt__Audience: "PizzaStoreUsers"
    volumes:
      - pizzastore_data:/app/data

volumes:
  pizzastore_data:
